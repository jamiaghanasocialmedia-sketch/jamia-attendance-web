<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jamia Attendance">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Jamia Attendance</title>
<script>try{var t=localStorage.getItem("theme")||"light";if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{
  /* iOS 27 system colours (Apple Design Resources) */
  --tint:#0088ff;--red:#ff4245;--green-ios:#30d158;--orange:#ff9230;
  --bg:#f2f2f7;--card:#ffffff;--fill:rgba(120,120,128,.16);--fill2:rgba(120,120,128,.12);--sep:rgba(60,60,67,.18);
  --ink:#000;--muted:#8e8e93;--glass:rgba(255,255,255,.62);--glass-edge:rgba(255,255,255,.7);--glass-line:#e8e8e8;--lab-vib:#1a1a1a;
  --shadow:0 8px 24px rgba(0,0,0,.08);--bgimg:url(bg.jpg);--veil:rgba(255,255,255,.55);--ctl:#fff;--ctl-shadow:0 1px 3px rgba(0,0,0,.16),0 0 0 .5px rgba(0,0,0,.05);--bar:rgba(255,255,255,.86);
  /* legacy names kept for inline use in app.js */
  --green:var(--tint);--cream:var(--bg);--sand:var(--sep);--sage:#8e8e93;--light:var(--fill);--err:var(--red)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;
  --bg:#000;--card:#1c1c1e;--fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.24);--sep:rgba(84,84,88,.6);
  --ink:#fff;--muted:#8e8e93;--glass:rgba(40,40,42,.6);--glass-edge:rgba(255,255,255,.12);--glass-line:rgba(255,255,255,.14);--lab-vib:#f2f2f7;
  --shadow:0 8px 24px rgba(0,0,0,.5);--bgimg:none;--veil:transparent;--ctl:#2c2c2e;--ctl-shadow:none;--bar:rgba(44,44,46,.8)}}
:root[data-theme=dark]{color-scheme:dark;
  --bg:#000;--card:#1c1c1e;--fill:rgba(120,120,128,.36);--fill2:rgba(120,120,128,.24);--sep:rgba(84,84,88,.6);
  --ink:#fff;--muted:#8e8e93;--glass:rgba(40,40,42,.6);--glass-edge:rgba(255,255,255,.12);--glass-line:rgba(255,255,255,.14);--lab-vib:#f2f2f7;
  --shadow:0 8px 24px rgba(0,0,0,.5);--bgimg:none}
:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--veil),var(--veil)),var(--bgimg) center top/cover no-repeat;pointer-events:none}
html,body{margin:0;color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
#app{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
/* navigation bar: glass with a large title */
.bar{position:sticky;top:calc(8px + env(safe-area-inset-top));margin:calc(8px + env(safe-area-inset-top)) 12px 0;z-index:5;background:var(--bar);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);display:flex;align-items:center;gap:8px;padding:12px 18px;border-radius:28px;box-shadow:0 12px 32px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08),inset 0 1px 0 var(--glass-edge),0 0 0 .5px var(--glass-line)}
.bar h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.12}.bar small{display:block;color:var(--muted);font-size:13px;letter-spacing:-.08px}
.bar-sp{width:44px}
button.t.menu{padding:8px;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--ctl);box-shadow:var(--ctl-shadow)}
button.t.menu svg{width:22px;height:22px;fill:var(--tint)}
.bar .grow{flex:1;min-width:0;text-align:center}
.pad{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
/* grouped-inset cards */
.card{background:var(--card);border-radius:24px;padding:14px 18px;box-shadow:none}
.card.tap{cursor:pointer}.card.tap:active,.stu:active{background:var(--fill2)}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}.hscroll>*{flex:none}.hscroll>:first-child{margin-left:auto}.hscroll>:last-child{margin-right:auto}
/* buttons: prominent capsule, tinted capsule, plain text */
button,.btn{font:inherit;font-size:17px;border:0;border-radius:999px;padding:11px 22px;background:var(--tint);color:#fff;font-weight:600;cursor:pointer;letter-spacing:-.01em;transition:transform .12s,opacity .12s}
button:active{transform:scale(.96);opacity:.85}
button.o{background:var(--ctl);color:var(--tint);box-shadow:var(--ctl-shadow)}
button.t{background:transparent;color:var(--tint);padding:8px 10px;font-weight:500}
.pad>.row>button.t,.pad>.hscroll>button.t{background:var(--ctl);box-shadow:var(--ctl-shadow);padding:9px 16px}
button.danger{background:var(--red);color:#fff}
button:disabled{opacity:.35}
.chip{padding:8px 16px;border-radius:999px;border:0;background:var(--ctl);box-shadow:var(--ctl-shadow);color:var(--ink);font-weight:500;font-size:15px}
.chip.act{color:var(--tint)}
.chip.on{background:var(--tint);color:#fff}
input[type=text],input[type=password],input[type=date],input[type=search],input[type=number],input[type=time],textarea,select{font:inherit;width:100%;padding:12px 14px;border:0;border-radius:14px;background:var(--fill2);color:var(--ink);outline:none}
input[type=date]{background:var(--ctl);box-shadow:var(--ctl-shadow)}
.row.date{justify-content:center}
.row.date input[type=date]{width:auto;flex:0 0 auto;min-width:0;max-width:150px;padding:7px 10px;font-size:15px;border-radius:12px}
.row.date button.o{padding:7px 14px}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--tint)}
label.chk{display:flex;gap:12px;align-items:center;padding:8px 0}
label.chk input{width:24px;height:24px;accent-color:var(--tint)}
.pf{display:flex;flex-direction:column;gap:6px}.pv{padding:9px 0;border-top:.5px solid var(--fill)}.pv .v{white-space:pre-wrap;word-break:break-word}.card .pv:first-of-type{border-top:0}
.muted{color:var(--muted);font-size:13px;letter-spacing:-.08px}.err{color:var(--red)}.b{font-weight:600}.big{font-size:34px;font-weight:700;color:var(--ink);letter-spacing:-.02em}
h3{margin:6px 0 0;font-size:20px;font-weight:600}
.pill{padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.stu{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:22px;padding:14px 18px;cursor:pointer;user-select:none}
.stu.locked{cursor:default}
/* floating glass tab bar (capsule) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;padding:0 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.nav>div{pointer-events:auto;display:flex;max-width:520px;width:100%;padding:4px;border-radius:1000px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:1.25px 0 0 -.75px var(--glass-line),-1.25px 0 0 -.75px var(--glass-line),0 0 0 .5px var(--glass-line),inset 0 1px 0 var(--glass-edge),var(--shadow)}
.nav button{flex:1;min-width:0;background:none;color:var(--lab-vib);border-radius:1000px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;font-weight:600;letter-spacing:0}
.nav button.on{background:var(--fill);color:var(--tint)}
.nav svg{width:24px;height:24px;fill:currentColor}
.grid{display:grid;gap:6px}
.cell{border-radius:12px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;background:var(--fill2);cursor:default}
.sumcol{display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;padding-left:6px;min-width:84px;pointer-events:none;user-select:none}
.sumtag{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;color:#1c1c1e}
.cell.ok{background:rgba(48,209,88,.22);cursor:pointer}.cell small{font-size:10px;font-weight:500}
/* sheets */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:34px 34px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;position:relative;box-shadow:var(--shadow)}
.modal::before{content:"";align-self:center;width:36px;height:5px;border-radius:3px;background:var(--fill);margin:-12px 0 4px}
@media (min-width:700px){.overlay{align-items:center}.modal{border-radius:34px}}
table{border-collapse:collapse;width:100%}td,th{padding:9px 6px;text-align:left;border-bottom:.5px solid var(--sep);font-size:15px}th{font-size:13px;color:var(--muted);font-weight:500}
.login{max-width:420px;margin:0 auto;padding:72px 24px;display:flex;flex-direction:column;gap:14px}
.login h1{color:var(--ink);margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);color:var(--ink);padding:12px 20px;border-radius:999px;z-index:30;font-weight:600;box-shadow:0 0 0 .5px var(--glass-line),var(--shadow)}

/* navigation: visible hover and keyboard focus for everything clickable */
button:focus-visible,.card.tap:focus-visible,.chip:focus-visible,.stu:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
@media (hover:hover){button:not(:disabled):hover{opacity:.88}.card.tap:hover,.stu:hover{background:var(--fill2)}}
.bar-sp.wide{width:96px}
button.t.menu.lbl{width:auto;height:auto;padding:8px 14px 8px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:var(--tint)}
button.t.menu.lbl svg{width:20px;height:20px}
/* Admin home: one accent colour, small radii, light shadows, three cards across on desktop */
.adm .bar{border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.08),0 0 0 .5px var(--glass-line)}
.adm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.adm .adm-card{display:flex;align-items:center;min-height:96px;padding:18px 20px;border-radius:12px;border:1px solid var(--sep);box-shadow:0 1px 2px rgba(0,0,0,.05);transition:border-color .12s,box-shadow .12s,background .12s}
.adm .adm-card .b{font-size:17px}
@media (hover:hover){.adm .adm-card:hover{border-color:var(--tint);box-shadow:0 2px 8px rgba(0,0,0,.08)}}
@media (max-width:700px){.adm-grid{grid-template-columns:1fr}.adm .adm-card{min-height:64px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
