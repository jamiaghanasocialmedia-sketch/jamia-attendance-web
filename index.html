<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jamia Attendance">
<meta name="theme-color" content="#F5F0E6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Jamia Attendance</title>
<style>
:root{--green:#1E3B2F;--cream:#F5F0E6;--sand:#C8B48A;--sage:#7F8C6A;--light:#E6DCC5;--ink:#1c1c1a;--muted:#6b6b62;--err:#b3261e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{max-width:900px;margin:0 auto;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.bar{position:sticky;top:0;z-index:5;background:rgba(245,240,230,.95);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--light)}
.bar h1{font-size:19px;margin:0;line-height:1.15}.bar small{display:block;color:var(--muted);font-size:12px}
.bar .grow{flex:1;min-width:0}
.pad{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 1px 3px rgba(30,59,47,.12)}
.card.tap{cursor:pointer}
.row{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}.grow{flex:1}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.hscroll>*{flex:none}
button,.btn{font:inherit;border:0;border-radius:999px;padding:10px 18px;background:var(--green);color:var(--cream);font-weight:600;cursor:pointer}
button.o{background:transparent;color:var(--green);border:1.5px solid var(--green)}
button.t{background:transparent;color:var(--green);padding:8px 10px}
button.danger{background:var(--err)}
button:disabled{opacity:.4}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--sand);background:transparent;color:var(--ink);font-weight:500}
.chip.on{background:var(--green);color:var(--cream);border-color:var(--green)}
input[type=text],input[type=password],input[type=date],input[type=search],textarea,select{font:inherit;width:100%;padding:11px 12px;border:1.5px solid var(--sand);border-radius:10px;background:#fff}
label.chk{display:flex;gap:10px;align-items:center;padding:7px 0}
label.chk input{width:22px;height:22px;accent-color:var(--green)}
.muted{color:var(--muted);font-size:13px}.err{color:var(--err)}.b{font-weight:700}.big{font-size:30px;font-weight:700;color:var(--green)}
h3{margin:6px 0 0;font-size:16px}
.pill{padding:4px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.stu{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:13px 14px;box-shadow:0 1px 3px rgba(30,59,47,.12);cursor:pointer;user-select:none}
.stu.locked{cursor:default}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--cream);border-top:1px solid var(--light);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav div{display:flex;max-width:900px;width:100%}
.nav button{flex:1;background:none;color:var(--green);border-radius:14px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600}
.nav button.on{background:var(--light)}
.nav svg{width:24px;height:24px;fill:currentColor}
.grid{display:grid;gap:5px}
.cell{border-radius:8px;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;background:#EDE8DB;cursor:default}
.cell.ok{background:#D5DCC4;cursor:pointer}.cell small{font-size:10px;font-weight:500}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
@media (min-width:700px){.overlay{align-items:center}.modal{border-radius:20px}}
table{border-collapse:collapse;width:100%}td,th{padding:7px 6px;text-align:left;border-bottom:1px solid var(--light);font-size:14px}th{font-size:12px;color:var(--muted)}
.login{max-width:420px;margin:0 auto;padding:60px 22px;display:flex;flex-direction:column;gap:12px}
.login h1{color:var(--green);margin:0;font-size:30px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--green);color:var(--cream);padding:10px 18px;border-radius:999px;z-index:30;font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
